<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>JobPlatform - Global Careers & Daily Gigs</title>
  <meta name="description" content="Global verified employment and daily gigs platform. Connecting top international candidates with verified employers. 100% Escrow and encrypted payments.">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%232563EB'><circle cx='12' cy='12' r='10'/></svg>">
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <!-- Root Application Container -->
  <div id="app"></div>

  <!-- Shared Modals Container -->
  <div id="applyModal" class="modal-overlay"></div>
  <div id="authModal" class="modal-overlay"></div>
  <div id="postJobModal" class="modal-overlay"></div>
  <div id="toastContainer" class="toast-container"></div>

  <!-- Scripts -->
  <script src="/js/icons.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/components/navbar.js"></script>
  <script src="/js/components/home.js"></script>
  <script src="/js/components/jobs.js"></script>
  <script src="/js/components/jobDetails.js"></script>
  <script src="/js/components/candidateDashboard.js"></script>
  <script src="/js/components/employerDashboard.js"></script>
  <script src="/js/components/adminDashboard.js"></script>
  <script src="/js/components/paymentFlow.js"></script>
  <script src="/js/components/authModals.js"></script>
  <script src="/js/components/postJobModal.js"></script>

  <script>
    // Master Reactive App Renderer
    window.renderApp = async function() {
      const app = document.getElementById('app');
      const route = window.AppState.currentRoute;
      const user = window.AppState.user;
      const isArabic = window.AppState.lang === 'ar';

      // 1. Render Top Navbar
      const navbarHtml = window.renderNavbar();

      // 2. Render Active View Content
      let mainContentHtml = '';
      if (route === 'home') {
        mainContentHtml = await window.renderHomePage();
      } else if (route === 'jobs') {
        mainContentHtml = await window.renderJobsPage();
      } else if (route === 'jobDetails') {
        mainContentHtml = await window.renderJobDetailsPage();
      } else if (route === 'payment') {
        mainContentHtml = await window.renderPaymentPage();
      } else if (route === 'dashboard') {
        if (!user) {
          mainContentHtml = await window.renderHomePage();
          setTimeout(() => window.openAuthModal('login'), 100);
        } else if (user.role === 'employer') {
          mainContentHtml = await window.renderEmployerDashboard();
        } else if (user.role === 'admin' || user.role === 'staff') {
          mainContentHtml = await window.renderAdminDashboard();
        } else {
          mainContentHtml = await window.renderCandidateDashboard();
        }
      } else if (route === 'admin') {
        mainContentHtml = await window.renderAdminDashboard();
      } else {
        mainContentHtml = await window.renderHomePage();
      }

      // 3. Render Footer
      const footerHtml = `
        <footer style="background-color: #070D1E; color: #94A3B8; border-top: 1px solid rgba(255, 255, 255, 0.08); padding: 4rem 0 3rem 0; margin-bottom: 64px;" class="desktop-footer-pad">
          <div class="container">
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 2.5rem; margin-bottom: 3rem;">
              <div>
                <div style="display: flex; align-items: center; gap: 0.75rem; color: #FFFFFF; font-weight: 800; font-size: 1.25rem; margin-bottom: 1rem;">
                  <div class="brand-badge-logo">
                    ${window.Icons.globe("w-5 h-5")}
                  </div>
                  <span>${window.t('brand')}</span>
                </div>
                <p style="font-size: 0.875rem; line-height: 1.6; color: #94A3B8; margin-bottom: 1.25rem;">
                  ${isArabic 
                    ? 'منصة التوظيف العالمية الشاملة لكافة الوظائف والعمل اليومي والدوام الكامل مع تسوية آمنة لنسبة المنصة (3%).'
                    : 'The premier global career and daily gig marketplace with enterprise-grade escrow security and transparent 3% platform commission.'
                  }
                </p>
                <div style="display: flex; align-items: center; gap: 0.5rem; font-size: 0.8125rem; color: #10B981;">
                  ${window.Icons.shieldCheck("w-4 h-4 text-emerald-400")}
                  <span>${isArabic ? '100% مدفوعات مشفرة ومحمية' : '100% Secure & Escrow Protected'}</span>
                </div>
              </div>

              <div>
                <h4 style="color: #FFFFFF; font-weight: 700; margin-bottom: 1rem; font-size: 0.9375rem;">
                  ${isArabic ? 'استكشف الوظائف' : 'Explore Jobs'}
                </h4>
                <ul style="list-style: none; display: flex; flex-direction: column; gap: 0.625rem; font-size: 0.875rem;">
                  <li><a href="javascript:void(0)" onclick="navigateTo('jobs', { job_type: 'daily_gig' })" style="color: #94A3B8; text-decoration: none;">${isArabic ? '⚡ عقود العمل اليومي (Daily Gigs)' : '⚡ Daily Gig Contracts'}</a></li>
                  <li><a href="javascript:void(0)" onclick="navigateTo('jobs', { job_type: 'full_time' })" style="color: #94A3B8; text-decoration: none;">${isArabic ? 'وظائف دوام كامل' : 'Full-time Opportunities'}</a></li>
                  <li><a href="javascript:void(0)" onclick="navigateTo('jobs', { workplace_type: 'remote' })" style="color: #94A3B8; text-decoration: none;">${isArabic ? 'وظائف عن بُعد عالمية' : 'Remote Worldwide Jobs'}</a></li>
                  <li><a href="javascript:void(0)" onclick="navigateTo('jobs', { category: 'Trades & Industry' })" style="color: #94A3B8; text-decoration: none;">${isArabic ? 'المهن الحرفية والصناعية' : 'Skilled Trades & Shifts'}</a></li>
                </ul>
              </div>

              <div>
                <h4 style="color: #FFFFFF; font-weight: 700; margin-bottom: 1rem; font-size: 0.9375rem;">
                  ${isArabic ? 'بوابات المنصة' : 'Portals & Access'}
                </h4>
                <ul style="list-style: none; display: flex; flex-direction: column; gap: 0.625rem; font-size: 0.875rem;">
                  <li><a href="javascript:void(0)" onclick="openAuthModal('login')" style="color: #94A3B8; text-decoration: none;">${isArabic ? 'بوابة الأفراد (تسجيل الدخول)' : 'Candidate Portal (Sign In)'}</a></li>
                  <li><a href="javascript:void(0)" onclick="openAuthModal('register')" style="color: #94A3B8; text-decoration: none;">${isArabic ? 'بوابة الشركات (إنشاء حساب)' : 'Employer Portal (Sign Up)'}</a></li>
                  <li><a href="javascript:void(0)" onclick="navigateTo('dashboard')" style="color: #94A3B8; text-decoration: none;">${isArabic ? 'لوحة تحكم المستخدم' : 'User Dashboard'}</a></li>
                  <li><a href="javascript:void(0)" onclick="navigateTo('admin')" style="color: #94A3B8; text-decoration: none;">${isArabic ? 'بوابة الإدارة والأمان' : 'Platform Administration'}</a></li>
                </ul>
              </div>

              <div>
                <h4 style="color: #FFFFFF; font-weight: 700; margin-bottom: 1rem; font-size: 0.9375rem;">
                  ${isArabic ? 'الأمان والعمولة' : 'Trust & Escrow'}
                </h4>
                <p style="font-size: 0.8125rem; line-height: 1.6; color: #94A3B8; margin-bottom: 0.75rem;">
                  ${isArabic 
                    ? 'نسبة المنصة المحددة (3%) يتم دفعها فور اعتماد العرض الوظيفي لضمان حماية الطرفين وتوثيق العقد رسمياً.'
                    : 'The fixed 3% platform commission is processed upon formal offer acceptance, providing escrow insurance and verified legal receipts.'
                  }
                </p>
                <div style="font-size: 0.75rem; color: #64748B;">
                  PCI-DSS Level 1 Compliant • 256-Bit SSL/TLS
                </div>
              </div>
            </div>

            <div style="border-top: 1px solid rgba(255, 255, 255, 0.08); padding-top: 1.5rem; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 1rem; font-size: 0.8125rem;">
              <div>
                © 2026 JobPlatform Global Inc. All rights reserved.
              </div>
              <div style="display: flex; gap: 1.5rem;">
                <span>ISO 27001 Certified</span>
                <span>GDPR Compliant</span>
                <span>SOC 2 Type II</span>
              </div>
            </div>
          </div>
        </footer>
      `;

      app.innerHTML = `
        ${navbarHtml}
        ${mainContentHtml}
        ${footerHtml}
      `;
    };
  </script>
</body>
</html>
